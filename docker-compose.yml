version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped

  whatsapp:
    build: ./whatsapp
    ports:
      - "8502:8502"
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped

volumes: {}
